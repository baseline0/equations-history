[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equations-history"
version = "0.1.0"
description = "Traceable, code-grounded equation narratives for learning ML math"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Mark Alexiuk", email = "malexiuk@gmail.com"}
]
license = {text = "MIT"}

dependencies = [
    "mcp>=2.2,<3",
    "sympy>=1.12",
    "typer>=0.9.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "jsonschema>=4.26.0",
    "pint>=0.26.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
]

[project.scripts]
learn = "equations_history.cli:app"
equations-history-mcp = "equations_history.mcp_server:main"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

# sympy ships no type information, so its imports are untyped by design.
[[tool.mypy.overrides]]
module = ["sympy"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]
# Markdown is not ruff territory: ruff 0.16 would reformat Python snippets inside it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "N", "RUF", "SIM", "TID"]
ignore = ["E501", "SIM105", "N818", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
argparse = {msg = "Use typer for CLIs: argparse is banned so every fleet CLI shares one framework with typed options and generated help."}

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["src", "tests"]
pythonPlatform = "All"
exclude = ["**/__pycache__", ".git", ".ruff_cache", ".mypy_cache", ".pytest_cache", ".tox", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = ["unit: fast tests, run by the shared test-unit recipe", "integration: tests that use real services or files across components", "e2e: end-to-end tests of a whole workflow", "unit: deterministic, isolated, no network/services/sibling repos", "integration: cross-repo/service interaction; requires local setup", "host: runs on the real host (services, sibling repos, LXC); never in CI"]

[tool.uv]
default-groups = ["dev"]

[tool.importlinter]
include_external_packages = true
[dependency-groups]
dev = [
    {include-group = "test"},
    "types-jsonschema>=4.23",
    "httpx>=0.27",
    "pyright>=1.1.414",
    "ruff==0.16.8",
    "antlr4-python3-runtime==4.11.1",
    "import-linter>=2.0.0,<3.0.0",
    "pre-commit>=4.6.2",
]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]
