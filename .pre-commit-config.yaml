repos:
  - repo: local
    hooks:
      - id: check-project-venv
        name: "[P0] VIRTUAL_ENV must be this repo's .venv"
        entry: bash ../fleet-base/scripts/check-project-venv.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: bash ../fleet-base/scripts/check-repo-root-pattern.sh
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: bash ../fleet-base/scripts/check-argparse-prohibition.sh
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
