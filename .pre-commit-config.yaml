default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: check-project-venv
        name: "[P0] VIRTUAL_ENV must be this repo's .venv"
        entry: fleet hook --name check-project-venv
        language: system
        pass_filenames: false
        always_run: true
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: fleet hook --name check-repo-root-pattern
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
      - id: whitespace-check
        name: '[P1] Whitespace in the staged diff (check only)'
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: check-hook-writers
        name: '[P1] No commit hook writes tracked files'
        entry: fleet hook --name check-hook-writers
        language: system
        pass_filenames: false
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: fleet hook --name check-argparse-prohibition
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
      - id: ruff-format
        args:
          - --check
  - repo: local
    hooks: []
  - repo: local
    hooks:
      - id: uv-lock-check
        name: "[P1] uv.lock matches pyproject.toml (read-only; run uv lock to fix)"
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-typer-explicit
        name: "[P1] typer commands take required --name value options (ratchet against baseline)"
        entry: fleet typer-explicit check --root . --baseline .typer-explicit-baseline.json
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: recipe-wrappers
        name: "[P1] just/fleet-recipes.just matches fleet-base"
        entry: just check-fleet-recipes
        language: system
        pass_filenames: false
        files: '^(just/fleet-recipes\.just|justfile)$'
        stages: [pre-commit]
